name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: FeelPathCore unit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/Core
        run: swift test

  ios-build:
    name: iOS app build (simulator, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen
      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project FeelPath.xcodeproj \
            -scheme FeelPath \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      # Unsigned device build, packaged as an .ipa. Sideloadly (Windows) or AltStore signs it
      # with a free Apple ID at install time — no Mac or paid developer account needed.
      - name: Build for device (unsigned)
        working-directory: ios
        run: |
          xcodebuild build \
            -project FeelPath.xcodeproj \
            -scheme FeelPath \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FeelPath.app Payload/
          zip -qry FeelPath-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FeelPath-unsigned-ipa
          path: ios/FeelPath-unsigned.ipa
          retention-days: 30
