# FeelPath — XcodeGen spec. On a Mac:  brew install xcodegen && cd ios && xcodegen
# The generated FeelPath.xcodeproj is git-ignored; edit this file instead.
name: FeelPath

options:
  bundleIdPrefix: com.feelpath
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  FeelPathCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Set your Apple team here or pick it in Xcode → Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  FeelPath:
    type: application
    platform: iOS
    sources:
      - FeelPath
    dependencies:
      - package: FeelPathCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.feelpath.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FeelPath
        INFOPLIST_KEY_NSCameraUsageDescription: FeelPath uses the camera and LiDAR scanner to detect obstacles and drops in front of you.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiredDeviceCapabilities: arkit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  FeelPath:
    build:
      targets:
        FeelPath: all
